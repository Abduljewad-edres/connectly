<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>Connectly — Connect. Share. Belong.</title>
    <meta name="description" content="Connectly is an international social networking platform for sharing posts, building connections, finding opportunities, and joining live audio spaces." />
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Color matching Connectly Navy branding -->
    <meta name="theme-color" content="#0b0f19" />
    <meta name="color-scheme" content="dark light" />

    <!-- Apple iOS Safari PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Connectly" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Standard and Alternate Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/icons/icon-192.png" />
    
    <!-- Microsoft Tile & Standalone App Meta -->
    <meta name="application-name" content="Connectly" />
    <meta name="msapplication-TileColor" content="#0b0f19" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
